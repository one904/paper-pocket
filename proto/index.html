<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>爱的流淌 · 奔流不息</title>
<style>
  :root{
    --paper:#F7F6F2;
    --ink:#160823;
    --blue:#1110A2;
    --bright:#475DDE;
    --line:rgba(22,8,35,.13);
    --muted:rgba(22,8,35,.5);
    --serif:'Songti SC','Noto Serif SC',STSong,Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--serif);
    padding:54px 28px calc(50px + env(safe-area-inset-bottom));
    line-height:1.85; -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .top{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:-apple-system,'PingFang SC',sans-serif;
    font-size:9px; letter-spacing:.34em; color:var(--muted);
    margin-bottom:64px;
  }
  .top .mark{color:var(--blue)}

  h1{
    font-size:46px; font-weight:400; letter-spacing:.22em;
    line-height:1.45; margin-bottom:6px;
  }
  .under{
    font-size:13px; letter-spacing:.62em; color:var(--blue);
    padding-left:2px; margin-bottom:56px;
  }

  .rule{height:1px;background:var(--line);margin:0 0 34px}

  .menu{list-style:none}
  .menu li{border-bottom:1px solid var(--line)}
  .menu a{
    display:flex; align-items:baseline; gap:16px;
    padding:21px 2px; text-decoration:none; color:var(--ink);
    transition:.3s;
  }
  .menu .no{
    font-family:-apple-system,'PingFang SC',sans-serif;
    font-size:9px; letter-spacing:.2em; color:var(--bright); width:22px; flex:none;
  }
  .menu .zh{font-size:19px; letter-spacing:.18em; flex:1}
  .menu .en{
    font-family:-apple-system,'PingFang SC',sans-serif;
    font-size:9px; letter-spacing:.24em; color:var(--muted); text-transform:uppercase;
  }
  .menu a:active{opacity:.45}

  .quote{
    margin-top:52px; font-size:13px; color:var(--muted);
    letter-spacing:.12em; line-height:2.1; padding-left:14px;
    border-left:1px solid var(--bright);
  }

  .foot{
    margin-top:60px; display:flex; justify-content:space-between;
    font-family:-apple-system,'PingFang SC',sans-serif;
    font-size:9px; letter-spacing:.24em; color:var(--muted);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--bright);
       display:inline-block;margin-right:8px;vertical-align:middle}
</style>
</head>
<body>

  <div class="top">
    <span>BETWEEN US · 01</span>
    <span class="mark">EST. 2026</span>
  </div>

  <h1>爱的流淌</h1>
  <div class="under">奔流不息</div>

  <div class="rule"></div>

  <ul class="menu">
    <li><a href="#"><span class="no">01</span><span class="zh">信</span><span class="en">letters</span></a></li>
    <li><a href="#"><span class="no">02</span><span class="zh">声</span><span class="en">sound</span></a></li>
    <li><a href="#"><span class="no">03</span><span class="zh">影</span><span class="en">images</span></a></li>
    <li><a href="#"><span class="no">04</span><span class="zh">话</span><span class="en">talk</span></a></li>
  </ul>

  <div class="quote">水一直在走，所以我们不用急着说些什么。</div>

  <div class="foot">
    <span><span class="dot"></span>纸 · 蓝 · 安静</span>
    <span>NO.01</span>
  </div>

</body>
</html>
